# docker compose up --build  ->  http://localhost:3000
# Configuração opcional no .env da raiz (veja .env.example). Sem ele, roda sem LLM.

# api e worker usam a mesma imagem. Sem `image:` fixo: com o mesmo nome nos
# dois, o build em paralelo falha com "image already exists".
x-api-base: &api-base
  build: ./api
  depends_on:
    mongo: { condition: service_healthy }
  environment: &api-env
    MONGODB_URI: mongodb://mongo:27017
    MONGODB_DB: tatubot
    JWKS_URL: http://web:3000/.well-known/jwks.json
    WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    REPOS_DIR: /data/repos
    LLM_PROVIDER: ${LLM_PROVIDER:-}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
    LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-gpt-4.1-mini}
    LLM_EMBED_MODEL: ${LLM_EMBED_MODEL:-}
    EMBED_PREFIX_DOC: ${EMBED_PREFIX_DOC:-}
    EMBED_PREFIX_QUERY: ${EMBED_PREFIX_QUERY:-}

services:
  mongo:
    image: mongo:7
    volumes: [mongo_data:/data/db]
    ports: ["127.0.0.1:27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 20

  web:
    build:
      context: ./web
      args:
        API_URL: http://api:4000
    depends_on:
      mongo: { condition: service_healthy }
    ports: ["3000:3000"]
    volumes: [jwt_chaves:/data/chaves]
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: tatubot
      # sem HTTPS local, os cookies precisam aceitar http
      COOKIE_INSEGURO: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/.well-known/jwks.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 30

  api:
    <<: *api-base
    depends_on:
      mongo: { condition: service_healthy }
      web: { condition: service_healthy }
    environment:
      <<: *api-env
      WORKER_MODE: "off"
    # só para depuração; o navegador sempre passa pelo web
    ports: ["127.0.0.1:4000:4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 30

  # consome a fila: indexação e respostas do bot (dá para escalar com --scale worker=3)
  worker:
    <<: *api-base
    command: ["node", "src/worker.js"]
    volumes: [repos_data:/data/repos]

  # LLM local no lugar da OpenAI:
  #   docker compose --profile ollama up -d ollama
  #   docker compose exec ollama ollama pull qwen2.5:7b
  #   docker compose exec ollama ollama pull nomic-embed-text
  # e no .env: LLM_PROVIDER=openai_compat, LLM_BASE_URL=http://ollama:11434/v1,
  # LLM_API_KEY=ollama, LLM_CHAT_MODEL=qwen2.5:7b, LLM_EMBED_MODEL=nomic-embed-text
  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    volumes: [ollama_data:/root/.ollama]
    ports: ["127.0.0.1:11434:11434"]
    environment:
      # sem isso o Ollama trunca o prompt sem avisar
      OLLAMA_CONTEXT_LENGTH: "16384"

volumes:
  mongo_data:
  repos_data:
  jwt_chaves:
  ollama_data:
